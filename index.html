    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              display: ['"DM Serif Display"', 'serif'],
              body: ['"DM Sans"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },

              accent: '#2563EB',
            },
          },
        },
      }

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syncopate:wght@400;700&family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-behavior: auto !important; /* Managed by Lenis smooth kinetic scroller */
        scroll-padding-top: 100px; /* Offset for fixed header */
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      
      /* Lenis support classes */
      html.lenis, html.lenis body {
        height: auto;
      }
      .lenis-smooth {
        scroll-behavior: auto !important;
      }
      .lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      .lenis-stopped {
        overflow: hidden;
      }
      .lenis-scrolling iframe {
        pointer-events: none;
      }
      
      /* Hide scrollbar for Chrome, Safari and Opera */
      ::-webkit-scrollbar {
        display: none;
      }

      body {
        font-family: 'Space Grotesk', sans-serif;
        background-color: #020000; /* Deep blackish-red base */
        color: #fff;
        overflow-x: hidden;
      }
      h1, h2, h3, .font-heading {
        font-family: 'Syncopate', sans-serif;
      }

      /* Hover dynamic glowing pulse with premium red hue */
      @keyframes pulseGlow {
        0% {
          box-shadow: 0 10px 30px -10px rgba(0,0,0,0.85), 0 0 12px 0px rgba(239, 68, 68, 0.2);
        }
        50% {
          box-shadow: 0 10px 30px -10px rgba(0,0,0,0.85), 0 0 25px 5px rgba(239, 68, 68, 0.45);
        }
        100% {
          box-shadow: 0 10px 30px -10px rgba(0,0,0,0.85), 0 0 12px 0px rgba(239, 68, 68, 0.2);
        }
      }
      .hover-pulse-glow:hover {
        animation: pulseGlow 1.8s infinite ease-in-out;
      }
      
      /* Dark mode overrides */
      html.dark body {
        background-color: #000000 !important;
      }
      @keyframes pulseGlowDark {
        0% {
          box-shadow: 0 10px 30px -10px rgba(0,0,0,0.85), 0 0 12px 0px rgba(255, 255, 255, 0.1);
        }
        50% {
          box-shadow: 0 10px 30px -10px rgba(0,0,0,0.85), 0 0 25px 5px rgba(255, 255, 255, 0.25);
        }
        100% {
          box-shadow: 0 10px 30px -10px rgba(0,0,0,0.85), 0 0 12px 0px rgba(255, 255, 255, 0.1);
        }
      }
      html.dark .hover-pulse-glow:hover {
        animation: pulseGlowDark 1.8s infinite ease-in-out;
      }
    </style>
