<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mitul Nayakwadi's Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23DFC19B' /%3E%3Cpath d='M 24,43 L 24,23 C 24,23 27,33 32,33 C 37,33 40,23 40,23 L 40,43' fill='none' stroke='%239C2F19' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round' /%3E%3C/svg%3E" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-behavior: auto !important; /* Managed by Lenis smooth kinetic scroller */
        scroll-padding-top: 100px; /* Offset for fixed header */
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      
      /* Lenis support classes */
      html.lenis, html.lenis body {
        height: auto;
      }
      .lenis-smooth {
        scroll-behavior: auto !important;
      }
      .lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      .lenis-stopped {
        overflow: hidden;
      }
      .lenis-scrolling iframe {
        pointer-events: none;
      }
      
      /* Hide scrollbar for Chrome, Safari and Opera */
      ::-webkit-scrollbar {
        display: none;
      }

      body {
        font-family: 'Space Grotesk', sans-serif;
        background-color: #020000; /* Deep blackish-red base */
        color: #fff;
        overflow-x: hidden;
      }
      h1, h2, h3, .font-heading {
        font-family: 'Syncopate', sans-serif;
      }

      /* Hover dynamic glowing pulse with premium red hue */
      @keyframes pulseGlow {
        0% {
          box-shadow: 0 10px 30px -10px rgba(0,0,0,0.85), 0 0 12px 0px rgba(239, 68, 68, 0.2);
        }
        50% {
          box-shadow: 0 10px 30px -10px rgba(0,0,0,0.85), 0 0 25px 5px rgba(239, 68, 68, 0.45);
        }
        100% {
          box-shadow: 0 10px 30px -10px rgba(0,0,0,0.85), 0 0 12px 0px rgba(239, 68, 68, 0.2);
        }
      }
      .hover-pulse-glow:hover {
        animation: pulseGlow 1.8s infinite ease-in-out;
      }
    </style>
